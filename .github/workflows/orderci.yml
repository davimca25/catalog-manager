name: Order Service CI

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]
    paths:
      - 'order-producer-service/**'
  pull_request:
    branches: [ "main" ]
    paths:
      - 'order-producer-service/**'

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: code checkout
        uses: actions/checkout@v4

      - name: setup java
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: maven

      - name: build and test - Producer Service
        working-directory: ./order-producer-service
        run: mvn clean package

