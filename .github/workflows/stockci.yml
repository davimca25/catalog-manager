name: Stock Service CI

on:
  workflow_dispatch:
  push:
    branches: ["main"]
    paths:
      - "stock-service/**"
  pull_request:
    branches: ["main"]
    paths: 
      - "stock-service/**"

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup java
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: "temurin"
          cache: maven

      - name: Build and test
        working-directory: ./stock-service
        run: mvn clean verify